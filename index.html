<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#3a8dc2" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
    <title>NINIT Group · CRM</title>

    <!-- Tipografía moderna: Manrope (títulos) + Inter (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { height: 100%; overflow: hidden; }
      body {
        height: 100%; margin: 0; overflow: hidden; overflow-x: hidden; overscroll-behavior: none;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #root {
        height: 100%; display: flex; flex-direction: column; overflow: hidden;
        /* Telón de fondo sutil azul→violeta (look IA) */
        background:
          radial-gradient(1100px 540px at 102% -12%, rgba(124,58,237,.07), transparent 60%),
          radial-gradient(900px 480px at -10% 112%, rgba(58,141,194,.08), transparent 58%),
          #F5F6F8;
      }
      /* Login puede scrollear aunque el root esté locked */
      .login-scroll { overflow-y: auto !important; -webkit-overflow-scrolling: touch; }

      /* iOS scroll nativo */
      .scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; }
      /* Ocultar scrollbar en strips horizontales */
      .strip::-webkit-scrollbar { display: none; }
      .strip { -ms-overflow-style: none; scrollbar-width: none; }

      /* ── Acento de foco azul→violeta en inputs/areas/selects ── */
      input:focus, textarea:focus, select:focus {
        border-color: #7C8AF0 !important;
        box-shadow: 0 0 0 3px rgba(124,138,240,.18) !important;
      }

      /* ── Scrollbars finas y modernas ── */
      .scroll-y::-webkit-scrollbar { width: 9px; height: 9px; }
      .scroll-y::-webkit-scrollbar-thumb {
        background: rgba(100,116,139,.28); border-radius: 999px;
        border: 2px solid transparent; background-clip: padding-box;
      }
      .scroll-y::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,.45); background-clip: padding-box; }
      .scroll-y::-webkit-scrollbar-track { background: transparent; }
      .scroll-y { scrollbar-width: thin; scrollbar-color: rgba(100,116,139,.3) transparent; }

      /* ── Selección de texto con tinte de marca ── */
      ::selection { background: rgba(124,138,240,.22); }

      /* ── Brillo del logo: destello cálido (sol) que recorre su silueta ── */
      .logo-brillo {
        background: linear-gradient(
          100deg,
          transparent 18%,
          rgba(255, 200, 90, 0.85) 34%,
          rgba(255, 255, 250, 1) 46%,
          rgba(255, 255, 250, 1) 54%,
          rgba(255, 200, 90, 0.85) 66%,
          transparent 82%
        );
        background-repeat: no-repeat;
        background-size: 320% 100%;
        background-position: 180% 0;
        /* Barrido lento (~2s) y luego descansa hasta completar el ciclo */
        animation: logoBrillo 4.5s ease-in-out infinite;
        will-change: background-position;
        filter: drop-shadow(0 0 7px rgba(255, 225, 150, 0.95));
      }
      @keyframes logoBrillo {
        0%   { background-position: 185% 0; }
        44%  { background-position: -85% 0; }
        100% { background-position: -85% 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .logo-brillo { animation: none; }
      }

      /* ── Botones: esquinas suaves pero minimalistas (menos "pastilla") ── */
      /* Global para unificar todo el CRM sin tocar cientos de estilos inline:
         aplasta los 326 border-radius inline (18 valores distintos) a uno solo.
         El valor real lo fija src/theme.js (RADIUS.btn) al arrancar la app;
         el 10px de acá es el fallback si el JS todavía no corrió. */
      :root { --radius-btn: 10px; }
      button { border-radius: var(--radius-btn) !important; }

      /* ── Micro-interacciones suaves en botones ── */
      button { transition: filter .15s ease, transform .08s ease, box-shadow .15s ease; }
      button:not(:disabled):hover { filter: brightness(1.04) saturate(1.03); }
      button:not(:disabled):active { transform: translateY(1px); }

      @media (prefers-reduced-motion: reduce) {
        button { transition: none; }
        button:active { transform: none; }
      }

      /* ── Layout responsive principal ── */
      /* Escritorio: rail de navegación · conversaciones · panel activo */
      .app-layout  { display: flex; height: 100%; overflow: hidden; }
      .app-rail    { flex-shrink: 0; width: 236px; height: 100%; }
      .app-sidebar { flex-shrink: 0; width: 380px; height: 100%; }
      .app-main    { flex: 1; min-width: 0; height: 100%; overflow: hidden; display: flex; flex-direction: column; }

      @media (max-width: 767px) {
        /* Móvil: sin rail (navega con los tabs), sidebar ocupa todo, panel oculto */
        .app-rail    { display: none !important; }
        .app-sidebar { width: 100% !important; min-width: 0 !important; }
        .app-main    { display: none !important; }

        /* Cuando hay un panel activo: ocultar sidebar, mostrar panel */
        .in-panel .app-sidebar { display: none !important; }
        .in-panel .app-main    { display: flex !important; flex: 1; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
